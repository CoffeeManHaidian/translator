name: macOS compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }} / Python 3.11
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify native Quartz frameworks load
        run: |
          python -c "from platforms.macos.quartz_api import MacOSQuartzApi; MacOSQuartzApi(); print('Quartz frameworks loaded')"

      - name: Run test suite
        run: python -m pytest -q
