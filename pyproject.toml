[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-translator"
version = "0.1.0"
description = "A cross-platform desktop translator for foreign trade workflows."
readme = "MVP_Implementation_Plan.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.10.1",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
trade-translator = "app.main:main"

[tool.setuptools]
packages = [
    "app",
    "ui",
    "providers",
    "settings",
    "translation",
    "platforms",
    "platforms.macos",
    "platforms.windows",
]
py-modules = ["resource_rc"]
include-package-data = true

[tool.setuptools.package-data]
ui = ["*.ui"]

[tool.pytest.ini_options]
addopts = "-ra"
qt_api = "pyside6"
testpaths = ["tests"]
